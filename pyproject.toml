[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.1.0a1"
description = "A self-hosted research intelligence system for fast-moving technical fields."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.11",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
research-radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
