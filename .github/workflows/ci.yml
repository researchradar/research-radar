name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check public commit identities
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_public_history.py --range "origin/$BASE_REF..HEAD"
          elif [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check_public_history.py --all
          else
            python scripts/check_public_history.py --range "$EVENT_BEFORE..HEAD"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest

      - name: Compile Python
        run: python -m compileall -q radar tests

      - name: Run tests
        run: pytest -q

      - name: Run offline fresh-workspace acceptance
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/radar"
          research-radar init "$WORKSPACE"
          research-radar collect --workspace "$WORKSPACE" --fixture-set synthetic --offline
          research-radar build-site --workspace "$WORKSPACE"
          test -f "$WORKSPACE/site/index.html"
          test -f "$WORKSPACE/site/reading.html"
          test -f "$WORKSPACE/site/search.html"
          test -f "$WORKSPACE/site/archive.html"
          test -f "$WORKSPACE/site/following.html"
          research-radar --version

      - name: Reject private or non-English product residue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('radar'), Path('scripts'), Path('tests'), Path('examples'), Path('pyproject.toml')]
          cjk = re.compile(r'[\u3400-\u9fff]')
          blocked = re.compile(
              r'[A-Z0-9._%+-]+@gmail\.com|/home/[A-Za-z0-9._-]+/',
              re.I,
          )
          findings = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if cjk.search(text):
                      findings.append(f'CJK:{path}')
                  if blocked.search(text):
                      findings.append(f'PRIVATE:{path}')
          if findings:
              raise SystemExit('\n'.join(findings))
          PY
